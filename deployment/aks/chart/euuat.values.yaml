julu-deploy:
  env:
    # -- Environment for the application
    prouat
  region:
    dnsZone: "azure-julu-np.net.com.eu"
    app: 12.5.12
    version: 5.7.9
    pdb:
      minAvailable:
        # -- Enable minAvailable pdb for application
        enabled: true
        # -- minAvailable value for pdb
        value: 1
      maxUnavailable:
        # -- Enable maxUnavailable pdb for application
        enabled: true
        # -- maxUnavailable value for pdb
        value: 2
      # -- Application name updated
      appName: Appname-version.1
  podResources:
    requests:
      cpu: 8
  scaledobject:
    scaledObject:
      triggers:
        - type: datadog
          metricType: Value
          metadata:
            query: avg:kubernetes.memory.usage_pct{kube_namespace:dd-namespace,kube_deployment:dd-deployment}
              * 100
            queryValue: "80"
            activationQueryValue: "40"
        - type: datadog
          metricType: Value
          metadata:
            query: ((sum:kubernetes.cpu.usage.total{kube_namespace:dd-namespace,kube_deployment:dd-deployment}
              / 1000000000) /
              sum:kubernetes.cpu.limits{kube_namespace:dd-namespace,kube_deployment:dd-deployment})
              * 100
            queryValue: "80"
            activationQueryValue: "40"
