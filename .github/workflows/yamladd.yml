name: One click Commit

on:
  workflow_dispatch:
    inputs:
      OverrideYaml:
        description: "Provide path-based override input, e.g. region~[europe]~dns~julu.com;"
        type: string
        required: true
        default: "region~[europe]~dns~julu.com"
      Release:
        description: "Select Release , Used to create branch with name and also used in PR title"
        type: choice
        required: true
        options:
          - 2026-JAN-I
          - 2026-JAN-II
          - 2026-FEB-I
          - 2026-FEB-II
          - 2026-MAR-I
          - 2026-MAR-II
          - 2026-APR-I
          - 2026-APR-II
          - 2026-MAY-I
          - 2026-MAY-II
          - 2026-MAY-III
          - 2026-JUN-I
          - 2026-JUN-II
          - 2026-JUL-I
          - 2026-JUL-II
          - 2026-AUG-I
          - 2026-AUG-II
          - 2026-SEP-I
          - 2026-SEP-II
          - 2026-OCT-I
          - 2026-OCT-II
          - 2026-OCT-III
          - 2026-NOV-I
          - 2026-NOV-II
          - 2026-DEC-I
          - 2026-DEC-II
      environment_files:
        description: "Provide environment specific yaml file name"
        type: choice
        required: true
        options:
          - "usuat"
          - "euuat"
          - "usuat,euuat"
        default: "usuat"
      config_file_Type:
        description: "Provide the Type of yaml file to be updated i.e cname or deploy"
        type: choice
        required: true
        options:
          - "cname"
          - "deploy"
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.MYSECRET }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install yaml

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate OverrideYaml input separator
        env:
          OVERRIDE_YAML: ${{ github.event.inputs.OverrideYaml }}
        shell: bash
        run: |
          set -euo pipefail
          trimmed="$(printf '%s' "$OVERRIDE_YAML" | sed -E 's/[[:space:]]+$//')"
          if [[ -z "$trimmed" ]]; then
            echo "OverrideYaml is empty"
            exit 1
          fi
          if [[ "$trimmed" != *';' ]]; then
            echo "Invalid OverrideYaml: it must end with ';'"
            exit 1
          fi

      - name: Validate input against referenceChart using yq
        env:
          OVERRIDE_YAML: ${{ github.event.inputs.OverrideYaml }}
        shell: bash
        run: |
          set -euo pipefail

          REF_FILE="./referenceChart.yml"
          if [[ ! -f "$REF_FILE" ]]; then
            echo "referenceChart.yml not found"
            exit 1
          fi

          split_top_level() {
            local text="$1"
            local delim="$2"
            local -n out_ref=$3
            out_ref=()

            local square=0
            local curly=0
            local paren=0
            local quote=""
            local escaped=0
            local current=""
            local ch=""

            for ((i=0; i<${#text}; i++)); do
              ch="${text:$i:1}"

              if [[ -n "$quote" ]]; then
                current+="$ch"
                if (( escaped == 1 )); then
                  escaped=0
                  continue
                fi
                if [[ "$ch" == "\\" ]]; then
                  escaped=1
                  continue
                fi
                if [[ "$ch" == "$quote" ]]; then
                  quote=""
                fi
                continue
              fi

              if [[ "$ch" == '"' || "$ch" == "'" ]]; then
                quote="$ch"
                current+="$ch"
                continue
              fi

              if [[ "$ch" == "[" ]]; then
                ((square+=1))
              elif [[ "$ch" == "]" ]]; then
                ((square>0)) && ((square-=1)) || true
              elif [[ "$ch" == "{" ]]; then
                ((curly+=1))
              elif [[ "$ch" == "}" ]]; then
                ((curly>0)) && ((curly-=1)) || true
              elif [[ "$ch" == "(" ]]; then
                ((paren+=1))
              elif [[ "$ch" == ")" ]]; then
                ((paren>0)) && ((paren-=1)) || true
              fi

              if [[ "$ch" == "$delim" && $square -eq 0 && $curly -eq 0 && $paren -eq 0 ]]; then
                out_ref+=("$current")
                current=""
                continue
              fi

              current+="$ch"
            done

            if [[ -n "${current// }" ]]; then
              out_ref+=("$current")
            fi
          }

          trim() {
            local var="$1"
            var="${var#"${var%%[![:space:]]*}"}"
            var="${var%"${var##*[![:space:]]}"}"
            printf '%s' "$var"
          }

          infer_value_kind() {
            local value
            value="$(trim "$1")"
            if [[ "$value" =~ ^\[.*\]$ ]]; then
              echo "array"
            elif [[ "$value" =~ ^\{.*\}$ ]]; then
              echo "object"
            else
              echo "scalar"
            fi
          }

          is_exception_parent_key() {
            local key="$1"
            case "$key" in
              envSecrets|envConfig|fileConfigMap|customAppLabels|customAppAnnotations)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          get_exception_parent_path() {
            local path_str="$1"
            local path_parts=()
            split_top_level "$path_str" "~" path_parts

            local total=${#path_parts[@]}
            local acc=""

            for ((i=0; i<total; i++)); do
              local seg
              seg="$(trim "${path_parts[$i]}")"

              if [[ -z "$acc" ]]; then
                acc="$seg"
              else
                acc+="~$seg"
              fi

              if is_exception_parent_key "$seg" && (( i < total - 1 )); then
                printf '%s' "$acc"
                return 0
              fi
            done

            return 1
          }

          fuzzy_match_keys() {
            local input_key="$1"
            local parent_key="$2"
            local ref_file="$3"

            # Get child keys under parent_key from referenceChart
            local children
            children="$(yq -r ".\"$parent_key\" | keys | .[]" "$ref_file" 2>/dev/null | sort -u)"

            if [[ -z "$children" ]]; then
              return
            fi

            local input_lower
            input_lower="$(echo "$input_key" | tr '[:upper:]' '[:lower:]')"
            local input_len=${#input_lower}

            # Match progressively: 1 char, 2 chars, 3 chars, etc., then full fuzzy
            declare -a matched_keys

            for ((len=1; len<=input_len; len++)); do
              local substring
              substring="${input_lower:0:$len}"

              while IFS= read -r child; do
                [[ -z "$child" ]] && continue
                local child_lower
                child_lower="$(echo "$child" | tr '[:upper:]' '[:lower:]')"

                if [[ "$child_lower" == "$substring"* ]]; then
                  matched_keys+=("$child")
                fi
              done <<< "$children"

              # If we found matches at this length, show them and stop
              if [[ ${#matched_keys[@]} -gt 0 ]]; then
                break
              fi
            done

            # If no substring match found, do simple substring search anywhere
            if [[ ${#matched_keys[@]} -eq 0 ]]; then
              while IFS= read -r child; do
                [[ -z "$child" ]] && continue
                local child_lower
                child_lower="$(echo "$child" | tr '[:upper:]' '[:lower:]')"

                if [[ "$child_lower" == *"$input_lower"* ]]; then
                  matched_keys+=("$child")
                fi
              done <<< "$children"
            fi

            # Deduplicate and output
            if [[ ${#matched_keys[@]} -gt 0 ]]; then
              printf '%s\n' "${matched_keys[@]}" | sort -u
            fi
          }

          validate_path_and_type() {
            local path_str="$1"
            local value_str="$2"
            local strict_type="${3:-true}"

            local path_parts=()
            split_top_level "$path_str" "~" path_parts

            if [[ ${#path_parts[@]} -lt 1 ]]; then
              echo "Invalid path: $path_str"
              return 1
            fi

            local first
            first="$(trim "${path_parts[0]}")"
            local expr=".. | select(type == \"!!map\" and has(\"$first\")) | .\"$first\""

            if ! yq -e "$expr | select(. != null)" "$REF_FILE" >/dev/null 2>&1; then
              echo "Path not found in referenceChart.yml: $path_str"
              echo "Parent key '$first' not found."
              
              # Try fuzzy match at root level
              local root_keys
              root_keys="$(yq -r 'keys | .[]' "$REF_FILE" 2>/dev/null | sort -u)"
              local fuzzy_results
              fuzzy_results="$(
                local input_lower
                input_lower="$(echo "$first" | tr '[:upper:]' '[:lower:]')"
                local input_len=${#input_lower}
                
                declare -a matched=()
                for ((len=1; len<=input_len; len++)); do
                  local substring="${input_lower:0:$len}"
                  while IFS= read -r key; do
                    [[ -z "$key" ]] && continue
                    local key_lower="$(echo "$key" | tr '[:upper:]' '[:lower:]')"
                    [[ "$key_lower" == "$substring"* ]] && matched+=("$key")
                  done <<< "$root_keys"
                  [[ ${#matched[@]} -gt 0 ]] && break
                done
                
                if [[ ${#matched[@]} -eq 0 ]]; then
                  while IFS= read -r key; do
                    [[ -z "$key" ]] && continue
                    local key_lower="$(echo "$key" | tr '[:upper:]' '[:lower:]')"
                    [[ "$key_lower" == *"$input_lower"* ]] && matched+=("$key")
                  done <<< "$root_keys"
                fi
                
                printf '%s\n' "${matched[@]}" | sort -u
              )"
              
              if [[ -n "$fuzzy_results" ]]; then
                echo "Did you mean one of these? $(echo "$fuzzy_results" | tr '\n' ', ' | sed 's/,$//')"
              fi
              return 1
            fi

            for ((p=1; p<${#path_parts[@]}; p++)); do
              local seg
              seg="$(trim "${path_parts[$p]}")"
              local next_expr="$expr | select(type == \"!!map\" and has(\"$seg\")) | .\"$seg\""

              if ! yq -e "$next_expr | select(. != null)" "$REF_FILE" >/dev/null 2>&1; then
                echo "Path not found in referenceChart.yml: $path_str"
                echo "Child key '$seg' not found under '${path_parts[$((p-1))]}'."
                
                # Try fuzzy match under parent
                local parent_key="${path_parts[$((p-1))]}"
                local parent_children
                parent_children="$(yq -r ".\"$parent_key\" | keys | .[]" "$REF_FILE" 2>/dev/null | sort -u)"
                
                local fuzzy_results
                fuzzy_results="$(
                  local input_lower
                  input_lower="$(echo "$seg" | tr '[:upper:]' '[:lower:]')"
                  local input_len=${#input_lower}
                  
                  declare -a matched=()
                  for ((len=1; len<=input_len; len++)); do
                    local substring="${input_lower:0:$len}"
                    while IFS= read -r child; do
                      [[ -z "$child" ]] && continue
                      local child_lower="$(echo "$child" | tr '[:upper:]' '[:lower:]')"
                      [[ "$child_lower" == "$substring"* ]] && matched+=("$child")
                    done <<< "$parent_children"
                    [[ ${#matched[@]} -gt 0 ]] && break
                  done
                  
                  if [[ ${#matched[@]} -eq 0 ]]; then
                    while IFS= read -r child; do
                      [[ -z "$child" ]] && continue
                      local child_lower="$(echo "$child" | tr '[:upper:]' '[:lower:]')"
                      [[ "$child_lower" == *"$input_lower"* ]] && matched+=("$child")
                    done <<< "$parent_children"
                  fi
                  
                  printf '%s\n' "${matched[@]}" | sort -u
                )"
                
                if [[ -n "$fuzzy_results" ]]; then
                  echo "Did you mean one of these? $(echo "$fuzzy_results" | tr '\n' ', ' | sed 's/,$//')"
                fi
                return 1
              fi

              expr="$next_expr"
            done

            if [[ "$strict_type" == "false" ]]; then
              yq -e "$expr | select(tag == \"!!map\")" "$REF_FILE" >/dev/null 2>&1 || {
                echo "Type mismatch at $path_str: expected object/map in referenceChart.yml"
                return 1
              }
              return 0
            fi

            local actual_kind
            actual_kind="$(infer_value_kind "$value_str")"

            if [[ "$actual_kind" == "array" ]]; then
              yq -e "$expr | select(tag == \"!!seq\")" "$REF_FILE" >/dev/null 2>&1 || {
                echo "Type mismatch at $path_str: expected array in referenceChart.yml"
                return 1
              }
            elif [[ "$actual_kind" == "object" ]]; then
              yq -e "$expr | select(tag == \"!!map\")" "$REF_FILE" >/dev/null 2>&1 || {
                echo "Type mismatch at $path_str: expected object in referenceChart.yml"
                return 1
              }
            else
              yq -e "$expr | select(tag != \"!!map\" and tag != \"!!seq\")" "$REF_FILE" >/dev/null 2>&1 || {
                echo "Type mismatch at $path_str: expected scalar in referenceChart.yml"
                return 1
              }
            fi
          }

          segments=()
          split_top_level "$OVERRIDE_YAML" ";" segments

          if [[ ${#segments[@]} -eq 0 ]]; then
            echo "No override segments found"
            exit 1
          fi

          for segment in "${segments[@]}"; do
            segment="$(trim "$segment")"
            [[ -z "$segment" ]] && continue

            parts=()
            split_top_level "$segment" "~" parts
            if [[ ${#parts[@]} -lt 2 ]]; then
              echo "Invalid override segment: $segment"
              exit 1
            fi

            value="$(trim "${parts[${#parts[@]}-1]}")"
            unset 'parts[${#parts[@]}-1]'

            path=""
            for part in "${parts[@]}"; do
              part="$(trim "$part")"
              if [[ -z "$path" ]]; then
                path="$part"
              else
                path+="~$part"
              fi
            done

            # Expand [a,b] path segments if provided.
            if [[ "$path" =~ \[.*\] ]]; then
              expanded=()
              split_top_level "$path" "~" path_tokens
              expand_list=("")
              for token in "${path_tokens[@]}"; do
                token="$(trim "$token")"
                if [[ "$token" =~ ^\[.*\]$ ]]; then
                  inner="${token:1:${#token}-2}"
                  split_top_level "$inner" "," inner_items
                  next_expand=()
                  for prefix in "${expand_list[@]}"; do
                    for item in "${inner_items[@]}"; do
                      item="$(trim "$item")"
                      if [[ -z "$prefix" ]]; then
                        next_expand+=("$item")
                      else
                        next_expand+=("$prefix~$item")
                      fi
                    done
                  done
                  expand_list=("${next_expand[@]}")
                else
                  for i in "${!expand_list[@]}"; do
                    if [[ -z "${expand_list[$i]}" ]]; then
                      expand_list[$i]="$token"
                    else
                      expand_list[$i]+="~$token"
                    fi
                  done
                fi
              done
              expanded=("${expand_list[@]}")
              for exp_path in "${expanded[@]}"; do
                if parent_path="$(get_exception_parent_path "$exp_path")"; then
                  validate_path_and_type "$parent_path" "{}" "false"
                else
                  validate_path_and_type "$exp_path" "$value"
                fi
              done
            else
              if parent_path="$(get_exception_parent_path "$path")"; then
                validate_path_and_type "$parent_path" "{}" "false"
              else
                validate_path_and_type "$path" "$value"
              fi
            fi
          done

          echo "yq validation passed for OverrideYaml"

      - name: Run the patching script
        # Pass OverrideYaml as an env var so multiline newlines are preserved.
        env:
          OVERRIDE_YAML: ${{ github.event.inputs.OverrideYaml }}
          ENVIRONMENT_FILES: ${{ github.event.inputs.environment_files }}
          CONFIG_FILE_TYPE: ${{ github.event.inputs.config_file_Type }}
        run: node app.js

      - name: fetch name
        run: |
          if [[ "${{ github.event.inputs.environment_files }}" == "*uat*" ]]; then
            echo "envs=$(echo uat)" >> $GITHUB_ENV
          elif [[ "${{ github.event.inputs.environment_files }}" == "*prod*" ]]; then
            echo "envs=$(echo prod)" >> $GITHUB_ENV
          fi
      - name: Commit and Push changes
        run: |
          git checkout -b feature/update-${{ env.envs }}-yaml-files-${{ github.event.inputs.Release }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --quiet; then
            git commit -m "chore(ci):Updated yaml files ${{ github.event.inputs.environment_files }} with provided override by ${{ github.actor }} in release ${{ github.event.inputs.Release }}"
            git push --set-upstream origin feature/update-${{ env.envs }}-yaml-files-${{ github.event.inputs.Release }}
          else
            echo "No changes to commit"
          fi
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.MYSECRET }}
        run: |
          gh pr create --title "chore(ci): Update yaml files ${{ github.event.inputs.environment_files }}" --body "This PR updates the yaml files with the provided override values by ${{ github.actor }}." --base ${{ github.ref }} --head feature/update-${{ env.envs }}-yaml-files-${{ github.event.inputs.Release }} --reviewer ${{ github.actor}}
