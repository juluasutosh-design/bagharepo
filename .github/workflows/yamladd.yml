name: One click Commit

on:
  workflow_dispatch:
    inputs:
      OverrideYaml:
        description: "Provide path-based override input, e.g. region~[europe]~dns~julu.com;"
        type: string
        required: true
        default: "region~[europe]~dns~julu.com"
      Release:
        description: "Select Release , Used to create branch with name and also used in PR title"
        type: choice
        required: true
        options:
          - 2026-JAN-I
          - 2026-JAN-II
          - 2026-FEB-I
          - 2026-FEB-II
          - 2026-MAR-I
          - 2026-MAR-II
          - 2026-APR-I
          - 2026-APR-II
          - 2026-MAY-I
          - 2026-MAY-II
          - 2026-MAY-III
          - 2026-JUN-I
          - 2026-JUN-II
          - 2026-JUL-I
          - 2026-JUL-II
          - 2026-AUG-I
          - 2026-AUG-II
          - 2026-SEP-I
          - 2026-SEP-II
          - 2026-OCT-I
          - 2026-OCT-II
          - 2026-OCT-III
          - 2026-NOV-I
          - 2026-NOV-II
          - 2026-DEC-I
          - 2026-DEC-II
      environment_files:
        description: "Provide environment specific yaml file name, i.e default points to values.yaml file only"
        type: choice
        required: true
        options:
          - "usuat"
          - "euuat"
          - "usuat,euuat"
          - "default"
        default: "usuat"
      config_file_Type:
        description: "Provide the Type of yaml file to be updated i.e cname or deploy"
        type: choice
        required: true
        options:
          - "deploy"
  workflow_call:
    inputs:
      OverrideYaml:
        description: "Provide path-based override input, e.g. region~[europe]~dns~julu.com;"
        required: true
        type: string
      Release:
        description: "Select Release , Used to create branch with name and also used in PR title"
        required: true
        type: string
      environment_files:
        description: "Provide environment specific yaml file name, i.e default points to values.yaml file only"
        required: true
        default: "usuat"
        type: string
      config_file_Type:
        description: "Provide the Type of yaml file to be updated i.e cname or deploy"
        required: true
        default: "deploy"
        type: string
    secrets:
      MYSECRET:
        required: true
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout deploy repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.MYSECRET }}


      - name: Validate selected environment file exists
        shell: bash
        env:
          ENVIRONMENT_FILES: ${{ inputs.environment_files }}
          CONFIG_FILE_TYPE: ${{ inputs.config_file_Type }}
        run: |
          set -euo pipefail

          IFS=',' read -r -a selected_envs <<< "$ENVIRONMENT_FILES"

          for env in "${selected_envs[@]}"; do
            env="$(printf '%s' "$env" | xargs)"
            [[ -z "$env" ]] && continue

            if [[ "$CONFIG_FILE_TYPE" == "deploy" ]]; then
              if [[ "$env" == "default" || "$env" == "values" ]]; then
                config_path="./deployment/aks/chart/values.yaml"
              else
                config_path="./deployment/aks/chart/${env}.values.yaml"
              fi
            else
              config_path="./deployment/aks/chart/cname/${env}.values.yaml"
            fi

            if [[ ! -f "$config_path" ]]; then
              echo "Required environment file not found: $config_path"
              exit 1
            fi
          done

      - name: Fetch name and setup git
        run: |
          if [[ "${{ inputs.environment_files }}" == *uat* ]]; then
            env_name="uat"
          elif [[ "${{ inputs.environment_files }}" == *prod* ]]; then
            env_name="prod"
          else
            echo "Taking default env name as values.yaml"
            env_name="values"
          fi

          branch_name="feature/update-${env_name}-yaml-files-${{ inputs.Release }}"
          echo "envs=$env_name" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=$branch_name" >> "$GITHUB_ENV"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "$branch_name" || true

          if git ls-remote --exit-code --heads origin "$branch_name" >/dev/null 2>&1; then
            git checkout -B "$branch_name" "origin/$branch_name"
          else
            git checkout -b "$branch_name"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Validate OverrideYaml input separator
        env:
          OVERRIDE_YAML: ${{ inputs.OverrideYaml }}
        shell: bash
        run: |
          set -euo pipefail
          trimmed="$(printf '%s' "$OVERRIDE_YAML" | sed -E 's/[[:space:]]+$//')"
          if [[ -z "$trimmed" ]]; then
            echo "OverrideYaml is empty"
            exit 1
          fi
          if [[ "$trimmed" != *';' ]]; then
            echo "Invalid OverrideYaml: it must end with ';'"
            exit 1
          fi
          if [[ "$trimmed" == ~* || "$trimmed" == *~ ]]; then
            echo "Invalid OverrideYaml: path segments must not start or end with '~'"
            exit 1
          fi
          if [[ "$trimmed" == *'~~'* ]]; then
            echo "Invalid OverrideYaml: empty path segment found between '~' characters"
            exit 1
          fi

      - name: Validate input against referenceChart using yq
        id: validate_input
        env:
          OVERRIDE_YAML: ${{ inputs.OverrideYaml }}
          REF_FILE: ./referenceChart.yml
        shell: bash
        run: bash .validate-reference-chart.sh

      - name: Fuzzy Match Suggestions
        if: ${{ failure() && steps.validate_input.outcome == 'failure' }}
        working-directory: deploy-repo
        env:
          OVERRIDE_YAML: ${{ inputs.OverrideYaml }}
          REF_FILE: ./referenceChart.yml
        shell: bash
        run: bash .fuzzy-match-suggestions.sh
      - name: Run the patching script
        working-directory: deploy-repo
        env:
          OVERRIDE_YAML: ${{ inputs.OverrideYaml }}
          RESOLVED_OVERRIDE_YAML: ${{ env.RESOLVED_OVERRIDE_YAML }}
          ENVIRONMENT_FILES: ${{ inputs.environment_files }}
          CONFIG_FILE_TYPE: ${{ inputs.config_file_Type }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${RESOLVED_OVERRIDE_YAML:-}" ]]; then
            export OVERRIDE_YAML="$RESOLVED_OVERRIDE_YAML"
          fi

          echo "Using OverrideYaml: $OVERRIDE_YAML"
          node ../workflow-tools/app.js

      - name: Commit and Push changes
        working-directory: deploy-repo
        run: |
          set -euo pipefail

          branch_name="${BRANCH_NAME}"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ci):Updated yaml files ${{ inputs.environment_files }} with provided override by ${{ github.actor }} in release ${{ inputs.Release }}"
            git push --set-upstream origin "$branch_name"
          fi
      - name: Create PR
        working-directory: deploy-repo
        env:
          GH_TOKEN: ${{ secrets.MYSECRET }}
        run: |
          gh pr create --title "chore(ci): Update yaml files ${{ inputs.environment_files }}" --body "This PR updates the yaml files with the provided override values by ${{ github.actor }}." --base "${GITHUB_REF_NAME}" --head "${BRANCH_NAME}" --reviewer ${{ github.actor}}
